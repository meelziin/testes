<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Imagem no Hover</title>
</head>
<body>
    <main>
        <div class="conteiner-flex">
            <div class="conteiner-img" id="imagem1">
                
            </div>

            <div class="conteiner-img" id="imagem2">
                <div class="links">
                    <i class="fa-solid fa-house"></i>
                    <i class="fa-solid fa-circle-user"></i>
                    <i class="fa-brands fa-github"></i>
                    <i class="fa-brands fa-reddit"></i>
                </div>
            </div>

            <div class="conteiner-img" id="imagem3">
                
            </div>

            <div class="conteiner-img" id="imagem4">
                <aside>
                    <div id="caixa">
                        <div class="flex-txt">
                            <div class="titulo-h2">
                                <h2>AIZEN</h2>
                            </div>
                        
                            <div class="txt">
                                <p>"Ninguém começa no topo do mundo. Nem você, nem eu, nem mesmo os deuses. Mas esse vazio insuportável no trono do céu vai acabar. De agora em diante, eu estarei sentado nele."</p>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="https://kit.fontawesome.com/b1158b1db6.js" crossorigin="anonymous"></script>
</body>
</html>
